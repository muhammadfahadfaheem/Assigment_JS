<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let guess;

        do{
            guess =Number(prompt("Guess Number"));

            if (guess===12){
                alert ("Correct");
            }else{
                alert ("Try again");
            }
        } while(guess!== 12);
    </script>
</body>
</html>
