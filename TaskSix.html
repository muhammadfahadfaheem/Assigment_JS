<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let password;

        do{
            password =  prompt("Enter Password");

            if (password==="12345") {
                console.log("Login Successful");
            } else{
                console.log("Wrong Password");
            }


        } while(password !=="12345");
    </script>
</body>
</html>
